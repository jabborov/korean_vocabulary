<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Applied before first paint to avoid a light/dark flash.
  (function(){
    try{
      var saved = localStorage.getItem('vocab-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root,
  [data-theme="dark"]{
    --bg: #0E1013;
    --bg-alt: #14171C;
    --line: #262B33;
    --text: #E7E9EC;
    --muted: #8B93A1;
    --accent: #F2B84B;
    --accent-dim: #7A6435;
    --shadow: rgba(0,0,0,0.35);
    --ok: #6CC08B;
    --weak: #E5766B;
  }
  [data-theme="light"]{
    --bg: #F7F5F0;
    --bg-alt: #EEEBE3;
    --line: #DCD7CB;
    --text: #201D18;
    --muted: #6E6A62;
    --accent: #A8681B;
    --accent-dim: #E7D2AC;
    --shadow: rgba(32,29,24,0.08);
    --ok: #2F7D4F;
    --weak: #B2402F;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background .2s ease, color .2s ease;
  }
  a{ color: inherit; text-decoration: none; }
  ::selection{ background: var(--accent-dim); color: var(--text); }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 28px; }
  h1,h2,h3{ font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -0.01em; }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  nav{
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:56px; gap: 12px; }
  .back{ font-size: 14px; color: var(--muted); display:flex; align-items:center; gap:6px; }
  .back:hover{ color: var(--text); }
  .nav-right{ display:flex; align-items:center; gap: 10px; min-width: 0; }
  #topic-title-nav{ font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back{ flex-shrink: 0; }

  .theme-toggle{
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg-alt);
    color: var(--muted); display:flex; align-items:center; justify-content:center;
    cursor: pointer; transition: border-color .15s ease, color .15s ease; flex-shrink:0;
  }
  .theme-toggle:hover{ border-color: var(--accent); color: var(--accent); }
  .random-btn{
    height: 34px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg-alt); color: var(--muted);
    font-family:'JetBrains Mono',monospace; font-size: 12.5px; cursor: pointer;
    transition: border-color .15s ease, color .15s ease; flex-shrink:0;
  }
  .random-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg{ width: 16px; height: 16px; }
  .theme-toggle .icon-sun{ display:none; }
  [data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  [data-theme="light"] .theme-toggle .icon-moon{ display:none; }

  header.head{ padding: 48px 0 28px; border-bottom: 1px solid var(--line); }
  .topic-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--accent); margin-bottom:10px; }
  header.head h1{ font-size: 28px; margin-bottom: 8px; }
  header.head p{ color: var(--muted); font-size: 15px; max-width: 60ch; margin-bottom: 24px; }

  .search-box{
    display:flex; align-items:center; gap: 10px;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; background: var(--bg-alt);
  }
  .search-box:focus-within{ border-color: var(--accent); }
  .search-box input{
    flex:1; background:none; border:none; outline:none; color:var(--text);
    font-family:'Inter',sans-serif; font-size: 15px;
  }
  .search-box input::placeholder{ color: var(--muted); }
  .search-icon{ color: var(--muted); font-size: 15px; }

  .level-bar{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .level-bar .pill{ height: 34px; padding: 0 8px; border-radius: 8px; background: var(--bg-alt); font-size: 12px; }
  .pill{
    font-family:'JetBrains Mono',monospace; font-size: 12.5px; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer;
  }
  .pill:hover{ color: var(--text); border-color: var(--text); }
  .pill.active{ color: var(--accent); border-color: var(--accent); }

  main{ padding: 32px 0 40px; }

  #count{ font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  .entry{
    border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 22px; margin-bottom: 12px;
  }
  .entry-top{ display:flex; align-items:baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .entry-word{ font-family:'Space Grotesk',sans-serif; font-size: 19px; font-weight: 600; }
  .entry-pos{ font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--accent); border:1px solid var(--accent-dim); border-radius:4px; padding: 2px 8px; }
  .entry-ipa{ font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted); }
  .entry-def{ font-size: 15px; margin-bottom: 6px; }
  .entry-tr{ font-size: 13.5px; color: var(--accent); margin-bottom: 8px; }
  .entry-ex{ font-size: 14px; color: var(--muted); font-style: italic; }
  .entry-ex::before{ content: "“"; }
  .entry-ex::after{ content: "”"; }

  .entry-actions{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap: 10px;
    margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
  }
  .status-group{ display:flex; flex-wrap:wrap; gap: 6px; }
  .status-btn{ font-size: 12px; padding: 3px 9px; }
  .status-btn.active[data-status="memorized"]{ color: var(--ok); border-color: var(--ok); }
  .status-btn.active[data-status="weak"]{ color: var(--weak); border-color: var(--weak); }
  .status-btn.active[data-status="learn"]{ color: var(--accent); border-color: var(--accent); }
  .entry.is-memorized{ border-left: 3px solid var(--ok); }
  .entry.is-weak{ border-left: 3px solid var(--weak); }
  .entry.is-learn{ border-left: 3px solid var(--accent); }

  .no-results{ color: var(--muted); text-align:center; padding: 48px 0; font-size: 15px; }

  .topic-nav{
    display:flex; flex-wrap:wrap; gap:8px; margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line);
  }
  .topic-nav a{
    font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
  }
  .topic-nav a.active{ color: var(--accent); border-color: var(--accent); }
  .topic-nav a:hover{ color: var(--text); border-color: var(--text); }

  footer{ padding: 32px 0 48px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

  @media (max-width: 600px){
    header.head{ padding: 32px 0 22px; }
    header.head h1{ font-size: 23px; }
    #topic-title-nav{ display:none; }
    nav .wrap{ height:auto; flex-wrap:wrap; padding-top:10px; padding-bottom:10px; gap:8px 10px; }
    .nav-right{ display:contents; }
    .back{ margin-right:auto; }
    .level-bar{ order:3; width:100%; }
    .level-bar .pill{ flex:1; height:32px; }
  }
  @media print{
    nav, .search-box, .topic-nav, .theme-toggle, .level-bar, .status-group{ display:none; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="back" href="index.html">← All topics</a>
    <div class="nav-right">
      <span id="topic-title-nav" class="mono"></span>
      <div class="level-bar" id="level-bar" role="group" aria-label="Example sentence CEFR level" title="Example sentence level"></div>
      <button class="random-btn" type="button" data-random-word title="Show a random word from all topics">↻ Random</button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark mode" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <div class="topic-eyebrow mono" id="topic-number"></div>
    <h1 id="topic-title"></h1>
    <p id="topic-desc"></p>
    <div class="search-box">
      <span class="search-icon mono">/</span>
      <input id="search" type="text" placeholder="Search words or translations..." autocomplete="off">
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="count" class="mono"></div>
    <div id="entries"></div>
    <div id="no-results" class="no-results" style="display:none;">No words match your search.</div>

    <div class="topic-nav" id="topic-nav"></div>
  </div>
</main>

<footer>
  <div class="wrap">Korean Vocabulary · Self-study topic-based reference</div>
</footer>

<script src="data.js"></script>
<script src="examples.js"></script>
<script src="random.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const keys = Object.keys(window.VOCAB_DATA);
  const topicKey = params.get('topic') || keys[0];
  const data = window.VOCAB_DATA[topicKey] || window.VOCAB_DATA[keys[0]];

  document.title = `${data.title} — Korean Vocabulary`;
  document.getElementById('topic-number').textContent = topicKey;
  document.getElementById('topic-title').textContent = data.title;
  document.getElementById('topic-title-nav').textContent = `${topicKey} · ${data.title}`;
  document.getElementById('topic-desc').textContent = data.desc;

  const entriesEl = document.getElementById('entries');
  const countEl = document.getElementById('count');
  const noResultsEl = document.getElementById('no-results');
  const searchEl = document.getElementById('search');

  // ----- Persistent storage helpers (same pattern as the theme toggle) -----
  function loadJSON(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
  }
  function saveJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  // ----- CEFR level for example sentences -----
  const LEVELS = ['A1','A2','B1','B2','C1','C2'];
  const examples = (window.VOCAB_EXAMPLES || {})[topicKey] || {};
  let level = loadJSON('vocab-level', null);
  if(!LEVELS.includes(level)) level = null; // null = original example from data.js

  function exampleFor(item){
    if(!level) return item.ex;
    const set = examples[item.w];
    return (set && set[LEVELS.indexOf(level)]) || item.ex;
  }

  const levelBar = document.getElementById('level-bar');
  LEVELS.forEach(lv => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill level-btn';
    b.dataset.level = lv;
    b.textContent = lv;
    b.title = `Show ${lv}-level example sentences (click again for the original)`;
    levelBar.appendChild(b);
  });
  function syncLevelButtons(){
    levelBar.querySelectorAll('.level-btn').forEach(b => {
      const on = b.dataset.level === level;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  levelBar.addEventListener('click', e => {
    const b = e.target.closest('.level-btn');
    if(!b) return;
    level = (level === b.dataset.level) ? null : b.dataset.level;
    saveJSON('vocab-level', level);
    syncLevelButtons();
    render(searchEl.value);
  });
  syncLevelButtons();

  // ----- Learning status per word (persisted) -----
  const STATUSES = [
    { key: 'memorized', label: 'Memorized' },
    { key: 'weak',      label: 'Weak' },
    { key: 'learn',     label: 'Need to Learn' }
  ];
  const statusMap = loadJSON('vocab-status', {});
  const statusId = item => `${topicKey}|${item.w}`;

  function applyStatus(div, status){
    STATUSES.forEach(s => div.classList.toggle(`is-${s.key}`, s.key === status));
    div.querySelectorAll('.status-btn').forEach(b => {
      const on = b.dataset.status === status;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  entriesEl.addEventListener('click', e => {
    const b = e.target.closest('.status-btn');
    if(!b) return;
    const div = b.closest('.entry');
    const id = div.dataset.id;
    const next = statusMap[id] === b.dataset.status ? null : b.dataset.status;
    if(next) statusMap[id] = next; else delete statusMap[id];
    saveJSON('vocab-status', statusMap);
    applyStatus(div, next);
  });

  function render(filter){
    const q = (filter || '').trim().toLowerCase();
    const filtered = data.words.filter(item =>
      !q || item.w.toLowerCase().includes(q) || item.def.toLowerCase().includes(q) ||
      (item.tr && item.tr.toLowerCase().includes(q))
    );

    entriesEl.innerHTML = '';
    if(filtered.length === 0){
      noResultsEl.style.display = 'block';
    } else {
      noResultsEl.style.display = 'none';
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'entry';
        div.dataset.id = statusId(item);
        div.innerHTML = `
          <div class="entry-top">
            <span class="entry-word">${item.w}</span>
            <span class="entry-pos mono">${item.p}</span>
            <span class="entry-ipa">${item.ipa}</span>
          </div>
          <div class="entry-def">${item.def}</div>
          ${item.tr ? `<div class="entry-tr">${item.tr}</div>` : ''}
          <div class="entry-ex">${exampleFor(item)}</div>
          <div class="entry-actions">
            <div class="status-group" role="group" aria-label="Learning status">
              ${STATUSES.map(s => `<button type="button" class="pill status-btn" data-status="${s.key}">${s.label}</button>`).join('')}
            </div>
          </div>
        `;
        applyStatus(div, statusMap[div.dataset.id] || null);
        entriesEl.appendChild(div);
      });
    }
    countEl.textContent = `${filtered.length} of ${data.words.length} words` + (level ? ` · ${level} examples` : '');
  }

  searchEl.addEventListener('input', e => render(e.target.value));
  render('');

  // Topic switcher
  const navEl = document.getElementById('topic-nav');
  keys.forEach(key => {
    const a = document.createElement('a');
    a.href = `topic.html?topic=${key}`;
    a.textContent = `${key} · ${window.VOCAB_DATA[key].title}`;
    if(key === topicKey) a.classList.add('active');
    navEl.appendChild(a);
  });

  // Theme toggle
  const toggleBtn = document.getElementById('theme-toggle');
  toggleBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('vocab-theme', next); }catch(e){}
  });
</script>

</body>
</html>
